services:
  postgres:
    image: postgres:16-alpine
    container_name: relay_postgres
    environment:
      POSTGRES_USER: relay_user
      POSTGRES_PASSWORD: relay_password
      POSTGRES_DB: relay_db
    ports:
      - "5433:5432"
    volumes:
      - relay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U relay_user -d relay_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: relay_redis
    ports:
      - "6381:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  relay_pg_data:
